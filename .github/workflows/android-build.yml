name: 🤖 Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci

      - name: 🔧 Instalar @capacitor/assets
        run: npm install -D @capacitor/assets

      - name: 🏗️ Build do React (Vite)
        run: npm run build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 Tornar gradlew executável
        run: chmod +x android/gradlew

      - name: 🏭 Build APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: meu-aplicativo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: ✅ Build Concluído!
        run: echo "🎉 APK gerado com sucesso! Baixe na aba Actions > Artifacts."
